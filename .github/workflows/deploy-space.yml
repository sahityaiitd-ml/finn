name: deploy-space
# Pushes services/api to the Hugging Face Space. Does nothing until you set the secret and variable.
on:
  push:
    branches: [main]
    paths: ["services/api/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push services/api to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}   # e.g. your-name/finn-api
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE not set: skipping deploy"; exit 0
          fi
          cp -r services/api /tmp/space && cd /tmp/space
          git init -q -b main && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "deploy $GITHUB_SHA"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
