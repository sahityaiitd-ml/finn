<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FINN</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4EFE8;
           color: #22262A; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 320px; padding: 24px; text-align: center; }
    h1 { font-size: 28px; font-weight: 500; margin: 0 0 8px; }
    p { color: #5A6170; line-height: 1.5; margin: 0 0 20px; }
    button { min-height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: #5E7361;
             color: #FDFBF8; font-size: 15px; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>FINN</h1>
    <p>Can't reach FINN right now. Check your connection and try again. If it has been idle, the server can take about a minute to wake.</p>
    <button onclick="location.href='https://finn-ruddy.vercel.app'">Try again</button>
  </main>
</body>
</html>
